name: BeidPrep Windows evaluation

on:
  push:
    branches: [codex/beidprep-evaluation-20261029]
    paths:
      - scripts/evaluation/**
      - .github/workflows/beidprep-evaluation.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install GUI automation dependencies
        run: python -m pip install requests pywinauto pillow
      - name: Supply verified Mesa software rendering for the GPU-less runner
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa3d-24.3.4-release-msvc.7z'
          $mesaRoot = Join-Path $env:RUNNER_TEMP 'mesa3d-24.3.4'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/24.3.4/mesa3d-24.3.4-release-msvc.7z' -OutFile $archive
          $expected = '7ebc711ad1896ac88ab21e142f1017f8ff035f0f342bdb72fbb5e2eb881ba363'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Mesa archive SHA-256 mismatch'
          }
          & 7z x $archive "-o$mesaRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Mesa archive extraction failed' }
          $osmesa = Get-ChildItem $mesaRoot -Recurse -File -Filter 'osmesa.dll' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (-not $osmesa) { throw 'Mesa x64 osmesa.dll not found' }
          $mesa64 = $osmesa.Directory.FullName
          $appdir = Join-Path $env:RUNNER_TEMP 'beidprep-trial'
          New-Item -ItemType Directory -Force $appdir | Out-Null
          Get-ChildItem $mesa64 -File -Filter '*.dll' | Copy-Item -Destination $appdir
          "BEIDPREP_MESA_DIR=$mesa64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $mesa64 | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Verified Mesa 24.3.4 x64 DLLs deployed for this application only"
      - name: Download and exercise the actual BeidPrep application
        timeout-minutes: 6
        run: python scripts/evaluation/beidprep_windows_trial.py
      - name: Preserve actual UI observations and saved decks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beidprep-windows-observations
          path: evaluation-output
          if-no-files-found: error
          retention-days: 7
