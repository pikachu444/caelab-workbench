name: CAE research handoff references
on:
  pull_request:
    paths:
      - 'docs/specs/cae-research/**'
      - 'docs/specs/spec-cae-research-implementation.md'
      - '.github/workflows/cae-research-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconstructed-references:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify committed recovery bytes and syntax
        run: python docs/specs/cae-research/check_handoff.py
      - name: Install reference dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pyvisco==2.1.3 filelock==4.2.10
      - name: Run recovered A arithmetic and deck recipes
        run: python docs/specs/cae-research/evidence/A/recovered_reference.py --output-root "$RUNNER_TEMP/A-reference"
      - name: Fetch pinned native release and record loader dependencies
        run: python docs/specs/cae-research/fetch_native_reference.py "$RUNNER_TEMP/OC-release"
      - name: Execute new LAW33 cap refinement references
        run: |
          python docs/specs/cae-research/evidence/A/recovered_native_runner.py --opencourant-root "$OC_REFERENCE_ROOT" --fixtures "$RUNNER_TEMP/A-reference" --output-root "$RUNNER_TEMP/A-native"
          python docs/specs/cae-research/evidence/A/recovered_native_check.py --native-root "$RUNNER_TEMP/A-native" --output "$RUNNER_TEMP/A-native-assessment.json"
      - name: Generate recovered D native decks
        run: python docs/specs/cae-research/evidence/D/generate_native_reference_recovered.py --output "$RUNNER_TEMP/D-reference"
      - name: Run recovered B independent numerical and existing optimizer probes
        env:
          B: docs/specs/cae-research/evidence/B
        run: |
          python "$B/reference_probe.py"
          python "$B/equilibrium_probe.py"
          python "$B/run_pyvisco.py"
          python "$B/optimizer_probe.py" --workbench-root "$GITHUB_WORKSPACE"
          python "$B/constraint_probe.py" --workbench-root "$GITHUB_WORKSPACE"
          python "$B/check_assets.py"
          python "$B/cold_reproduce.py" --workbench-root "$GITHUB_WORKSPACE" --destination "$RUNNER_TEMP/B-cold"
      - name: Package handoff and current reference outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caelab-full-implementation-handoff
          path: |
            docs/specs/spec-cae-research-implementation.md
            docs/specs/cae-research/
            ${{ runner.temp }}/A-reference/
            ${{ runner.temp }}/A-native/
            ${{ runner.temp }}/A-native-assessment.json
            ${{ runner.temp }}/OC-release/download_receipt.json
            ${{ runner.temp }}/OC-release/ldd.txt
            ${{ runner.temp }}/B-cold/
            ${{ runner.temp }}/D-reference/
